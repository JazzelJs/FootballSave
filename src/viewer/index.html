<!doctype html>
<meta charset="utf-8">
<title>football3d viewer</title>
<!--
Stage 3 viewer skeleton: the pitch in 3D, tracks.json loaded, play/pause/scrub.

Usage (from the repo root, because it fetches data/tracks/<clip>.json):
    python3 -m http.server 8000
    open http://localhost:8000/src/viewer/?clip=SNGS-043     (or ?clip=clip04)

Pitch meters -> three.js: x stays x, y (into the field) becomes -z, up is +y.
So the attacked goal is at z = 0 and the far goal at z = -105.
Players are 1.8 m capsules coloured by team. Two cameras: orbit and the goalkeeper's (button, or press c).
'show gaps' (or g) adds a faint capsule where a lost player was last seen.
Playback interpolates between frames, so motion is smooth on any screen.
-->
<style>
  body { margin: 0; background: #111; color: #eee; font: 13px system-ui, sans-serif; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 10px;
         align-items: center; padding: 8px 12px; background: #000a; }
  #bar input[type=range] { flex: 1; }
  #play { width: 34px; }
  #msg { position: fixed; top: 10px; left: 12px; }
</style>
<div id="msg">loading…</div>
<div id="bar">
  <button id="play">▶</button>
  <input id="scrub" type="range" min="0" value="0" step="1">
  <span id="clock">0.0 s</span>
  <button id="poseView">pose view</button>
  <button id="orbitView">orbit view</button>
  <button id="view">goal view</button>
  <button id="gaps">show gaps</button>
</div>

<script type="importmap">
{ "imports": {
  "three": "./vendor/three.module.js",
  "three/addons/controls/": "./vendor/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// Same numbers as src/calib/pitch_model.py (and minimap.py's HALF_W / HALF_L), in meters.
const HALF_W = 34, LENGTH = 105, BOX_W = 40.32, BOX_D = 16.5, GOAL_AREA_W = 18.32,
      GOAL_AREA_D = 5.5, GOAL_W = 7.32, GOAL_H = 2.44, SPOT = 11, ARC_R = 9.15, CIRCLE_R = 9.15;

const query = new URLSearchParams(location.search);
const clip = query.get('clip') || 'SNGS-043';
// The macOS bundle stages data beside this file; the development server keeps the repo layout.
const dataRoot = location.protocol === 'file:' ? './data' : '../../data';
// Poses belong to ONE clip: a track id means nothing outside the clip it was tracked in. Without
// the `clip` field the viewer loaded these four meshes on clip04 too and announced "4 posed
// tracks" for a clip that has none -- and id 1131 could land on whoever clip04 happens to call
// 1131. ALL_POSES is the catalogue; POSES is what this clip actually has.
const ALL_POSES = [
  // Mesh files carry the clip in their name for the same reason this list does: SNGS-043 has a
  // track 17 and so does clip04, and a flat pose_17.smpl cannot be both.
  { clip: 'SNGS-043', trackId: 1131, file: 'pose/mesh/pose_SNGS-043_1131.smpl' },  // the shooter
  // The three stable players nearest the goal during clip time 00:00:15–00:00:25.
  { clip: 'SNGS-043', trackId: 284, file: 'pose/mesh/pose_SNGS-043_284.smpl' },
  { clip: 'SNGS-043', trackId: 17, file: 'pose/mesh/pose_SNGS-043_17.smpl' },
  { clip: 'SNGS-043', trackId: 171, file: 'pose/mesh/pose_SNGS-043_171.smpl' },
  // clip04: the shooter is 10; 15, 17 and 9 sit 13–18 m out, in the ball's path.
  { clip: 'clip04', trackId: 10, file: 'pose/mesh/pose_clip04_10.smpl' },
  { clip: 'clip04', trackId: 15, file: 'pose/mesh/pose_clip04_15.smpl' },
  { clip: 'clip04', trackId: 17, file: 'pose/mesh/pose_clip04_17.smpl' },
  { clip: 'clip04', trackId: 9, file: 'pose/mesh/pose_clip04_9.smpl' }
];
const POSES = ALL_POSES.filter(pose => pose.clip === clip);

const scene = new THREE.Scene();
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
document.body.append(renderer.domElement);

const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 500);
camera.position.set(0, 30, 45);                       // behind the attacked goal, looking up the pitch
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, -35);
controls.maxPolarAngle = Math.PI / 2 - 0.01;  // stop at ground level: the grass is one-sided, so from below the pitch disappears

// The goalkeeper camera: standing in the middle of the attacked goal, looking up the pitch.
// Bolted in place on purpose: measured on SNGS-043, a fixed 50 deg / 16:9 view keeps every
// player on screen in all 750 frames, so panning after the players would buy nothing.
const gkCam = new THREE.PerspectiveCamera(50, 1, 0.1, 500);
gkCam.position.set(0, 1.7, 0);                        // goal centre, eye height
gkCam.lookAt(0, 1.7, -30);                            // level, 30 m up the pitch: no tilt, no target to follow
let active = camera;

function resize() {
  for (const c of [camera, gkCam]) {                  // both cameras, or the spare one keeps a stale aspect
    c.aspect = innerWidth / innerHeight;
    c.updateProjectionMatrix();
  }
  renderer.setSize(innerWidth, innerHeight);
}
addEventListener('resize', resize); resize();

// ---- the pitch -------------------------------------------------------------
const grass = new THREE.Mesh(
  new THREE.PlaneGeometry(2 * HALF_W + 10, LENGTH + 16),
  new THREE.MeshBasicMaterial({ color: 0x2b6e2b }));
grass.rotation.x = -Math.PI / 2;
grass.position.set(0, -0.01, -LENGTH / 2);            // just under the lines, so they stay visible
scene.add(grass);

const segs = [];                                      // pairs of [x, y] in pitch meters
const line = (a, b) => segs.push(a, b);
const poly = pts => { for (let i = 1; i < pts.length; i++) line(pts[i - 1], pts[i]); };

// outline, halfway line, centre circle
poly([[-HALF_W, 0], [HALF_W, 0], [HALF_W, LENGTH], [-HALF_W, LENGTH], [-HALF_W, 0]]);
line([-HALF_W, LENGTH / 2], [HALF_W, LENGTH / 2]);
poly(Array.from({ length: 65 }, (_, i) => {
  const t = i / 64 * 2 * Math.PI;
  return [CIRCLE_R * Math.sin(t), LENGTH / 2 + CIRCLE_R * Math.cos(t)];
}));

// both ends: s = +1 at the attacked goal (y = 0), -1 at the far goal (y = 105)
for (const [y0, s] of [[0, 1], [LENGTH, -1]]) {
  const box = (w, d) => poly([[-w / 2, y0], [-w / 2, y0 + s * d], [w / 2, y0 + s * d], [w / 2, y0]]);
  box(BOX_W, BOX_D);
  box(GOAL_AREA_W, GOAL_AREA_D);
  const arc = [];                                     // the bit of the penalty arc outside the box
  for (let i = 0; i <= 40; i++) {
    const t = -Math.PI / 2 + i / 40 * Math.PI;
    const p = [ARC_R * Math.sin(t), y0 + s * (SPOT + ARC_R * Math.cos(t))];
    if (Math.abs(p[1] - y0) >= BOX_D) arc.push(p);
  }
  poly(arc);
}

const white = new THREE.LineBasicMaterial({ color: 0xffffff });
const flat = segs.flatMap(([x, y]) => [x, 0, -y]);
scene.add(new THREE.LineSegments(
  new THREE.BufferGeometry().setAttribute('position', new THREE.Float32BufferAttribute(flat, 3)), white));

// the two goals, as posts + crossbar
for (const y0 of [0, LENGTH]) {
  const g = [], post = GOAL_W / 2, z = -y0;
  g.push(-post, 0, z, -post, GOAL_H, z, post, 0, z, post, GOAL_H, z, -post, GOAL_H, z, post, GOAL_H, z);
  scene.add(new THREE.LineSegments(
    new THREE.BufferGeometry().setAttribute('position', new THREE.Float32BufferAttribute(g, 3)), white));
}

// ---- players ---------------------------------------------------------------
// One 1.8 m capsule per player, coloured by the team teams.py wrote into tracks.json.
const playerGeom = new THREE.CapsuleGeometry(0.35, 1.1, 4, 12);   // 1.1 straight + 2 x 0.35 caps = 1.8 m
const TEAM_COLOUR = { A: 0xffc800, B: 0x005aff, other: 0xdcdcdc };  // same colours as minimap.py, as RGB hex
const teamMat = Object.fromEntries(Object.entries(TEAM_COLOUR)
  .map(([team, c]) => [team, new THREE.MeshLambertMaterial({ color: c })]));
scene.add(new THREE.HemisphereLight(0xffffff, 0x336633, 2));  // Lambert is black without light; green bounce off the grass
const pool = [];                                      // reused, so we don't build meshes every frame

function drawPlayers(players) {
  players.forEach((p, i) => {
    if (!pool[i]) scene.add(pool[i] = new THREE.Mesh(playerGeom, teamMat.other));
    // A pool slot is not a player: the list changes length and order, so re-colour every frame.
    // (clip04 has team: null until teams.py has run, and teamMat[null] would hide the capsule.)
    pool[i].material = teamMat[p.team] ?? teamMat.other;
    pool[i].position.set(p.x, 0.9, -p.y);             // pitch (x, y) -> three.js (x, up, -y), 0.9 = half of 1.8 = feet on the grass
    pool[i].visible = true;
  });
  for (let i = players.length; i < pool.length; i++) pool[i].visible = false;
}

// ---- Stage 4 SMPL mesh -----------------------------------------------------
// HMR2 already produced the posed 6890-vertex body. Draw it directly instead
// of approximating its motion on a second character skeleton.
function loadSMPL(buffer, pose) {
  const view = new DataView(buffer);
  const magic = String.fromCharCode(...new Uint8Array(buffer, 0, 4));
  if (magic !== 'SMPL') throw new Error('invalid SMPL mesh file');
  const frameCount = view.getUint32(4, true), vertexCount = view.getUint32(8, true);
  const faceCount = view.getUint32(12, true), fps = view.getFloat32(16, true);
  let offset = 20;
  const frames = new Int32Array(buffer, offset, frameCount); offset += frames.byteLength;
  const faces = new Uint32Array(buffer, offset, faceCount * 3); offset += faces.byteLength;
  const vertices = new Float32Array(buffer, offset, frameCount * vertexCount * 3);
  const geometry = new THREE.BufferGeometry();
  geometry.setIndex(new THREE.BufferAttribute(faces, 1));
  geometry.setAttribute('position', new THREE.BufferAttribute(
    new Float32Array(vertexCount * 3), 3).setUsage(THREE.DynamicDrawUsage));
  pose.mesh = new THREE.Mesh(geometry, new THREE.MeshStandardMaterial({
    color: 0xc58f70, roughness: 0.85, metalness: 0, side: THREE.DoubleSide
  }));
  pose.group = new THREE.Group();
  pose.group.add(pose.mesh);
  scene.add(pose.group);
  pose.smpl = { frames, vertices, vertexCount, fps,
    byFrame: new Map(Array.from(frames, (frame, index) => [frame, index])) };
}

function poseSample(pose, frame) {
  const exact = pose.smpl?.byFrame.get(frame);
  if (exact !== undefined) return { a: exact, b: exact, mix: 0 };
  // HMR2 has no crop for frame 599. Blend the adjacent meshes instead of flashing back to a capsule.
  const a = pose.smpl?.byFrame.get(frame - 1), b = pose.smpl?.byFrame.get(frame + 1);
  return a !== undefined && b !== undefined ? { a, b, mix: 0.5 } : null;
}

function posePlayer(pose, frame) {
  const trackFrame = data.frames.find(f => f.frame === frame);
  const exact = trackFrame?.players.find(p => p.id === pose.trackId);
  if (exact) return exact;
  const before = data.frames.find(f => f.frame === frame - 1)?.players.find(p => p.id === pose.trackId);
  const after = data.frames.find(f => f.frame === frame + 1)?.players.find(p => p.id === pose.trackId);
  return before && after ? { x: (before.x + after.x) / 2, y: (before.y + after.y) / 2 } : null;
}

function drawSMPL(pose, frame) {
  if (!pose.smpl) return false;                       // the next Kaggle batch may not be downloaded yet
  const player = posePlayer(pose, frame), sample = poseSample(pose, frame);
  if (!sample || !player) { pose.group.visible = false; return false; }
  const startA = sample.a * pose.smpl.vertexCount * 3, startB = sample.b * pose.smpl.vertexCount * 3;
  const position = pose.mesh.geometry.attributes.position;
  // export_smpl_mesh.py --clip already writes the body in these axes (x, up, -pitch y), so the
  // only thing left is to stand it on the grass. Negating y here instead would MIRROR the body:
  // flipping one axis swaps left and right, which is what used to need a per-clip 180 deg fix.
  let footY = Infinity;
  const value = j => pose.smpl.vertices[startA + j] * (1 - sample.mix) + pose.smpl.vertices[startB + j] * sample.mix;
  for (let j = 1; j < position.array.length; j += 3) footY = Math.min(footY, value(j));
  for (let j = 0; j < position.array.length; j += 3) {
    position.array[j] = value(j);
    position.array[j + 1] = value(j + 1) - footY;
    position.array[j + 2] = value(j + 2);
  }
  position.needsUpdate = true;
  pose.mesh.geometry.computeVertexNormals();
  pose.group.position.set(player.x, 0, -player.y);
  pose.group.visible = true;
  return true;
}

// ---- players the tracker lost ----------------------------------------------
// A player is "in a gap" when their id was seen earlier and comes back later, but is
// missing right now: the detector lost them, they didn't leave. We can only show where
// they were LAST SEEN, so a ghost stands still while the real player runs on.
const ghostMat = new THREE.MeshLambertMaterial({ color: 0xffffff, transparent: true, opacity: 0.25 });
const ghostPool = [];
let gaps = [], showGaps = false;

// Two ball sources, and they are not the same kind of thing. Inside the fitted flight window
// we have a real 3D position with a HEIGHT, from src/ball/fit.py. Outside it all we have is a
// pixel, and a pixel alone cannot give depth -- so there we fall back to putting the ball on the
// grass with the inverse homography, which is only true while the ball really is on the grass.
//
// Which pixel matters. The fallback used to read `ball_px` out of tracks.json, which is the
// PLAYER detector's most confident "ball" box -- on clip04 that jumps 1690 px between frames,
// because it hops to the spare balls by the ad boards. data/ball/<clip>_clean.json is the ball
// detector's track after Stage 5's cleaning (95% step 31 px, and it never invents a frame), so
// prefer it and keep tracks.json only for a clip that has no ball file at all (SNGS-028).
const ball = new THREE.Mesh(new THREE.SphereGeometry(0.11, 12, 8),
  new THREE.MeshLambertMaterial({ color: 0xffffff }));
scene.add(ball);
let cameraFrames = new Map();
let ballFlight = new Map();   // frame -> [x, y, z] in pitch meters, only inside the fitted window
let ballPixels = new Map();   // frame -> [u, v], the cleaned 2D track, for frames outside the flight

function drawBall(frame) {
  const flight = ballFlight.get(frame);
  if (flight) {
    // three.js is y-up, so the project convention is three = (x, z, -y).
    // Clamped to the ball's own radius: the fit measures the centre from z = 0 on the grass, so
    // a few cm of negative z is noise, not a ball underground.
    ball.position.set(flight[0], Math.max(flight[2], 0.11), -flight[1]);
    ball.material.color.setHex(0xffdd33);   // yellow while this is a fitted 3D flight
    ball.visible = true;
    return;
  }
  ball.material.color.setHex(0xffffff);
  const px = ballPixels.get(frame) ?? data.frames.find(f => f.frame === frame)?.ball_px;
  const H = cameraFrames.get(frame);
  if (!px || !H) { ball.visible = false; return; }
  const inv = new THREE.Matrix3().set(
    H[0][0], H[0][1], H[0][2], H[1][0], H[1][1], H[1][2], H[2][0], H[2][1], H[2][2]).invert();
  const p = new THREE.Vector3(px[0], px[1], 1).applyMatrix3(inv);
  p.multiplyScalar(1 / p.z);
  ball.position.set(p.x, 0.11, -p.y);
  ball.visible = true;
}

function findGaps(frames) {
  const lastFrame = new Map();                        // id -> the last frame it is ever seen in
  frames.forEach((f, k) => f.players.forEach(p => lastFrame.set(p.id, k)));
  const seen = new Map();                             // id -> the last position we had for it
  return frames.map((f, k) => {
    f.players.forEach(p => seen.set(p.id, p));        // only ids from BEFORE k are in here
    const here = new Set(f.players.map(p => p.id));
    return [...seen.entries()]
      .filter(([id]) => !here.has(id) && k < lastFrame.get(id))   // missing now, back later
      .map(([, p]) => p);
  });
}

function drawGaps(frame) {
  const ghosts = showGaps ? gaps[frame] : [];
  ghosts.forEach((p, i) => {
    if (!ghostPool[i]) scene.add(ghostPool[i] = new THREE.Mesh(playerGeom, ghostMat));
    ghostPool[i].position.set(p.x, 0.9, -p.y);
    ghostPool[i].visible = true;
  });
  for (let i = ghosts.length; i < ghostPool.length; i++) ghostPool[i].visible = false;
}

// ---- playback --------------------------------------------------------------
const play = document.getElementById('play'), scrub = document.getElementById('scrub'),
      clock = document.getElementById('clock'), msg = document.getElementById('msg');
let data = null, i = 0, playing = false, last = 0;

// The data is 25 fps (49.95 for clip04) and the screen is usually 60 Hz, so a stored frame
// would be held for ~2.4 refreshes and then jump. Ask for a position BETWEEN two frames instead.
// Per player, not per list position: the two lists differ in length and order, so match on id.
function playersAt(f) {
  const k = Math.floor(f), frac = f - k;
  const now = data.frames[k].players, next = data.frames[k + 1]?.players;
  if (!next || frac === 0) return now;
  const byId = new Map(next.map(p => [p.id, p]));
  return now.map(p => {
    const q = byId.get(p.id);                         // the same player in the next frame, if still there
    return q ? { ...p, x: p.x + (q.x - p.x) * frac, y: p.y + (q.y - p.y) * frac } : p;
  });                                                 // a player who vanishes stays put for that fraction
}

function show(f) {
  i = Math.max(0, Math.min(data.frames.length - 1, f));
  const k = Math.round(i);
  const frame = data.frames[k].frame;
  const players = playersAt(i);
  const posedIds = new Set(POSES.filter(pose => drawSMPL(pose, frame)).map(pose => pose.trackId));
  drawPlayers(players.filter(p => !posedIds.has(p.id)));
  drawBall(frame);
  drawGaps(k);
  scrub.value = k;
  clock.textContent = (i / data.fps).toFixed(1) + ' s'
    + (showGaps && gaps[k].length ? ` (+${gaps[k].length} lost)` : '');
}

const gapsBtn = document.getElementById('gaps');
gapsBtn.onclick = () => {
  showGaps = !showGaps;
  gapsBtn.textContent = showGaps ? 'hide gaps' : 'show gaps';
  show(Math.round(i));
};

const view = document.getElementById('view');
view.onclick = () => {
  active = active === camera ? gkCam : camera;
  if (active === camera) restoreOrbit();
  controls.enabled = active === camera;               // don't let a drag move a camera you can't see
  view.textContent = active === camera ? 'goal view' : 'orbit view';
};

const orbitPosition = camera.position.clone();
const orbitTarget = controls.target.clone();
function restoreOrbit() {
  active = camera;
  camera.position.copy(orbitPosition);
  controls.target.copy(orbitTarget);
  controls.enabled = true;
  controls.update();
}

const poseView = document.getElementById('poseView');
poseView.onclick = () => {
  const frame = data.frames[Math.round(i)].frame;
  const pose = POSES.find(p => p.smpl && posePlayer(p, frame));
  const player = pose && posePlayer(pose, frame);
  if (!player) return;
  active = camera;
  controls.enabled = true;
  camera.position.set(player.x + 4, 2.8, -player.y + 6);
  controls.target.set(player.x, 0.9, -player.y);
  controls.update();
  view.textContent = 'goal view';
};
document.getElementById('orbitView').onclick = restoreOrbit;

play.onclick = () => { playing = !playing; play.textContent = playing ? '❚❚' : '▶'; last = performance.now(); };
scrub.oninput = () => { playing = false; play.textContent = '▶'; show(+scrub.value); };
addEventListener('keydown', e => {
  if (e.key === ' ') play.onclick();
  if (e.key === 'ArrowRight') show(Math.round(i) + 1);
  if (e.key === 'ArrowLeft') show(Math.round(i) - 1);
  if (e.key === 'c') view.onclick();
  if (e.key === 'g') gapsBtn.onclick();
});

function tick(now) {
  requestAnimationFrame(tick);
  if (data && playing) {
    const step = (now - last) / 1000 * data.fps;      // real time, whatever the screen does
    last = now;
    show((i + step) % data.frames.length);
  }
  if (controls.enabled) controls.update();
  renderer.render(scene, active);
}
requestAnimationFrame(tick);

function checkInterp() {
  const k = Math.floor(data.frames.length / 2);
  const a = data.frames[k].players[0], b = data.frames[k + 1].players.find(p => p.id === a.id);
  if (!b) return console.log('interp check: skipped, first player is not in the next frame');
  const mid = playersAt(k + 0.5).find(p => p.id === a.id);
  console.assert(Math.abs(mid.x - (a.x + b.x) / 2) < 1e-9 && Math.abs(mid.y - (a.y + b.y) / 2) < 1e-9,
    'halfway between two frames must be the midpoint', a, b, mid);
  console.assert(playersAt(k)[0].x === a.x, 'a whole frame number must be the stored frame');
  console.log(`interp check: ok (id ${a.id} x ${a.x.toFixed(2)} -> ${mid.x.toFixed(2)} -> ${b.x.toFixed(2)})`);
}

Promise.all([
  fetch(`${dataRoot}/tracks/${clip}.json`).then(r => r.ok ? r.json() : Promise.reject(r.status)),
  fetch(`${dataRoot}/camera/${clip}.json`).then(r => r.ok ? r.json() : Promise.reject(r.status)),
  // no-cache, because a re-exported mesh keeps its name and size: the browser will happily serve
  // the previous one, and an old camera-space mesh renders upside down under the current code.
  // Optional: a clip without a fitted flight still works, it just has no flying ball.
  fetch(`${dataRoot}/ball/${clip}_fit.json`).then(r => r.ok ? r.json() : null).catch(() => null),
  fetch(`${dataRoot}/ball/${clip}_clean.json`).then(r => r.ok ? r.json() : null).catch(() => null),
  ...POSES.map(pose => fetch(`${dataRoot}/${pose.file}`, { cache: 'no-cache' })
    .then(r => r.ok ? r.arrayBuffer() : null))
])
  .then(([d, camera, ballFit, ballClean, ...meshes]) => {
    data = d;
    cameraFrames = new Map(camera.frames.map(f => [f.frame, f.H]));
    if (ballFit) ballFlight = new Map(ballFit.path_frames.map((f, i) => [f, ballFit.path[i]]));
    // Only `label` rows: a `filled` row is our own interpolation and a `dropped` one we already
    // decided not to trust, so neither belongs in the picture as if it were a measurement.
    if (ballClean) ballPixels = new Map(ballClean.frames
      .filter(r => r.source === 'label').map(r => [r.frame, r.px]));
    meshes.forEach((mesh, index) => { if (mesh) loadSMPL(mesh, POSES[index]); });
    gaps = findGaps(d.frames);
    scrub.max = d.frames.length - 1;
    const loadedPoses = POSES.filter(pose => pose.smpl).length;
    msg.textContent = `${d.clip} — ${d.frames.length} frames — `
      + (POSES.length ? `${loadedPoses} posed tracks — ` : 'capsules only, no poses — ')
      + (ballFlight.size ? `ball in 3D for frames ${ballFit.window[0]}–${ballFit.window[1]} `
          + `(${ballFit.speed_kmh.toFixed(0)} km/h, ${ballFit.px_median.toFixed(1)} px)`
        : 'calibrated ball when visible');
    // Frame 599 is SNGS-043's interpolated pose frame, so only assert it on that clip.
    if (clip === 'SNGS-043') console.assert(poseSample(POSES[0], 599)?.mix === 0.5 && posePlayer(POSES[0], 599), 'frame 599 must interpolate pose and position');
    const firstPoseIndex = d.frames.findIndex(f => POSES.some(pose => poseSample(pose, f.frame) && posePlayer(pose, f.frame)));
    show(firstPoseIndex >= 0 ? firstPoseIndex : 0);
    if (firstPoseIndex >= 0) poseView.onclick();
    checkInterp();
  })
  .catch(e => { msg.textContent = `could not load viewer data (${e}) — serve the repo root`; });
